intro: "I'm in the third year of a CS PhD at Northlake Institute of Technology with [Dr. Imre Vasko](https://example.org/~vasko), after two years on backend teams at Fernway and Calder Labs."
now: "measuring cold starts in serverless edge inference, writing up the power-capped scheduler, and getting Lanternfish to a 1.0 release this winter."
highlights:
  items:
    - { value: "up to 41%", what: "less energy per job, and 3× fewer misses", source: "[power-capped scheduler](#research), in preparation for a 2027 systems venue" }
